name: phober-backend

# ──────────────────────────────────────────────────────────────────────────────
# Reusable building blocks
# ──────────────────────────────────────────────────────────────────────────────

x-php-image: &php-image abdukhaligov/phober-php-apache:2.1.0

x-php-base: &php-base
    image: *php-image
    restart: unless-stopped
    networks: [private]
    entrypoint: sh -c "apache2 -D FOREGROUND"

x-healthcheck: &healthcheck
    test: ["CMD", "curl", "-fsS", "http://localhost/up"]
    interval: 10m
    retries: 5
    start_period: 10m
    timeout: 1m

x-shared-laravel-package: &shared-laravel-package
    ./shared/laravel-common:/var/www/html/vendor/phobiavr/phober-laravel-common

x-php-ini: &php-ini ./docker/phober-php/php.ini:/usr/local/etc/php/conf.d/zz-phober.ini:ro
x-php-opcache: &php-opcache ./docker/phober-php/opcache.ini:/usr/local/etc/php/conf.d/zz-opcache.ini:ro

x-logging-env: &logging-env
    LOG_CHANNEL: stack
    LOG_STACK: "stderr,sentry"
    LOG_LEVEL: debug

# ──────────────────────────────────────────────────────────────────────────────
# Services
# ──────────────────────────────────────────────────────────────────────────────

services:
    nginx-proxy-manager:
        image: jc21/nginx-proxy-manager:latest
        container_name: nginx-proxy-manager
        restart: unless-stopped
        ports:
            - "80:80"
            - "81:81"
            - "443:443"
        volumes:
            - ./docker/npm/data:/data
            - ./docker/npm/letsencrypt:/etc/letsencrypt
        networks: [public, private]

    api-gateway:
        image: nginx:latest
        container_name: api-gateway
        restart: unless-stopped
        volumes:
            - ./docker/api-gateway/nginx.conf:/etc/nginx/nginx.conf
            - ./docker/api-gateway/public:/etc/nginx/public:ro
        networks: [public, private]
        depends_on:
            - notification-server
            - auth-server
            - device-service
            - crm-service
            - staff-service
            - config-server

    adminpanel:
        <<: *php-base
        container_name: adminpanel
        networks: [private, public]
        healthcheck: *healthcheck
        env_file:
            - docker/env/apache.env
            - docker/env/laravel.env
            - docker/env/redis.env
            - docker/env/mail.env
            - docker/env/s3.env
            - docker/env/reverb.env
            - docker/env/db-admin-default.env
            - docker/env/db-auth-admin.env
            - docker/env/db-device-admin.env
            - docker/env/db-crm-admin.env
            - docker/env/db-staff-admin.env
            - docker/env/db-configs-admin.env
            - docker/env/db-shared-admin.env
        environment:
            <<: *logging-env
            APP_KEY: ${APP_KEY_ADMINPANEL}
            SENTRY_DSN: "http://sentry@buggregator:8000/adminpanel"
            AWS_URL: "${API_GATEWAY_HOST:-https://api.phober.test}/s3"
            QUEUE_CONNECTION: database
            DB_QUEUE: adminpanel
            DB_QUEUE_CONNECTION: db_shared
        volumes:
            - *php-ini
            - *php-opcache
            - *shared-laravel-package
            - ./services/adminpanel:/var/www/html

    auth-server:
        <<: *php-base
        container_name: auth-server
        healthcheck: *healthcheck
        env_file:
            - docker/env/apache.env
            - docker/env/laravel.env
            - docker/env/redis.env
            - docker/env/reverb.env
            - docker/env/db-auth-admin.env
            - docker/env/db-shared-admin.env
        environment:
            <<: *logging-env
            APP_KEY: ${APP_KEY_AUTH_SERVER}
            SENTRY_DSN: "http://sentry@buggregator:8000/auth-server"
            DB_CONNECTION: sqlite
            QUEUE_CONNECTION: database
            DB_QUEUE: auth
            DB_QUEUE_CONNECTION: db_shared
        volumes:
            - *php-ini
            - *php-opcache
            - *shared-laravel-package
            - ./services/auth-server:/var/www/html

    config-server:
        <<: *php-base
        container_name: config-server
        healthcheck: *healthcheck
        env_file:
            - docker/env/apache.env
            - docker/env/laravel.env
            - docker/env/redis.env
            - docker/env/mail.env
            - docker/env/db-configs-admin.env
            - docker/env/db-shared-admin.env
        environment:
            <<: *logging-env
            APP_KEY: ${APP_KEY_CONFIG_SERVER}
            SENTRY_DSN: "http://sentry@buggregator:8000/config-server"
            USE_CACHE: "false"
            QUEUE_CONNECTION: database
            DB_QUEUE: config
            DB_QUEUE_CONNECTION: db_shared
        volumes:
            - *php-ini
            - *php-opcache
            - *shared-laravel-package
            - ./services/config-server:/var/www/html

    notification-server:
        <<: *php-base
        container_name: notification-server
        healthcheck: *healthcheck
        env_file:
            - docker/env/apache.env
            - docker/env/laravel.env
            - docker/env/redis.env
            - docker/env/mail.env
            - docker/env/db-shared-admin.env
        environment:
            <<: *logging-env
            APP_KEY: ${APP_KEY_NOTIFICATION_SERVER}
            SENTRY_DSN: "http://sentry@buggregator:8000/notification-server"
            DISCORD_TOKEN: ${DISCORD_TOKEN:-}
            DISCORD_SUPPORT_CHANNEL: ${DISCORD_SUPPORT_CHANNEL:-}
            DISCORD_OTP_CHANNEL: ${DISCORD_OTP_CHANNEL:-}
            TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
            TELEGRAM_OTP_CHANNEL: ${TELEGRAM_OTP_CHANNEL:-}
            TELEGRAM_SUPPORT_CHANNEL: ${TELEGRAM_SUPPORT_CHANNEL:-}
            QUEUE_CONNECTION: database
            DB_QUEUE: notification
            DB_QUEUE_CONNECTION: db_shared
        volumes:
            - *php-ini
            - *php-opcache
            - *shared-laravel-package
            - ./services/notification-server:/var/www/html

    device-service:
        <<: *php-base
        container_name: device-service
        healthcheck: *healthcheck
        deploy:
            replicas: 1
        env_file:
            - docker/env/apache.env
            - docker/env/laravel.env
            - docker/env/redis.env
            - docker/env/mail.env
            - docker/env/s3.env
            - docker/env/reverb.env
            - docker/env/db-device-default.env
            - docker/env/db-shared-admin.env
            - docker/env/rabbitmq.env
        environment:
            <<: *logging-env
            APP_KEY: ${APP_KEY_DEVICE_SERVICE}
            SENTRY_DSN: "http://sentry@buggregator:8000/device-service"
            APP_URL: /hardware
            AWS_URL: /s3/media
            #RABBITMQ_QUEUE: device
            #QUEUE_CONNECTION: rabbitmq
            QUEUE_CONNECTION: database
            DB_QUEUE: device
            DB_QUEUE_CONNECTION: db_shared
        volumes:
            - *php-ini
            - *php-opcache
            - *shared-laravel-package
            - ./services/device-service:/var/www/html

    crm-service:
        <<: *php-base
        container_name: crm-service
        healthcheck: *healthcheck
        env_file:
            - docker/env/apache.env
            - docker/env/laravel.env
            - docker/env/redis.env
            - docker/env/mail.env
            - docker/env/db-crm-default.env
            - docker/env/db-shared-admin.env
        environment:
            <<: *logging-env
            APP_KEY: ${APP_KEY_CRM_SERVICE}
            SENTRY_DSN: "http://sentry@buggregator:8000/crm-service"
            QUEUE_CONNECTION: database
            DB_QUEUE: crm
            DB_QUEUE_CONNECTION: db_shared
        volumes:
            - *php-ini
            - *php-opcache
            - *shared-laravel-package
            - ./services/crm-service:/var/www/html

    staff-service:
        <<: *php-base
        container_name: staff-service
        healthcheck: *healthcheck
        env_file:
            - docker/env/apache.env
            - docker/env/laravel.env
            - docker/env/redis.env
            - docker/env/mail.env
            - docker/env/reverb.env
            - docker/env/db-staff-default.env
            - docker/env/db-shared-admin.env
            - docker/env/rabbitmq.env
        environment:
            <<: *logging-env
            APP_KEY: ${APP_KEY_STAFF_SERVICE}
            SENTRY_DSN: "http://sentry@buggregator:8000/staff-service"
            #RABBITMQ_QUEUE: staff
            #QUEUE_CONNECTION: rabbitmq
            QUEUE_CONNECTION: database
            DB_QUEUE: staff
            DB_QUEUE_CONNECTION: db_shared
        volumes:
            - *php-ini
            - *php-opcache
            - *shared-laravel-package
            - ./services/staff-service:/var/www/html

networks:
    private:
        external: true
        name: phober_private
    public:
        external: true
        name: phober_public
